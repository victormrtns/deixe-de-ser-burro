[project]
name = "entrelinhas-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=3.8.0",
  "pillow>=10.4",
  "psycopg[binary]>=3.2",
  "pwdlib[argon2]>=0.2",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.4",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-asyncio>=0.24", "pyyaml>=6.0", "ruff>=0.6", "types-pyyaml>=6.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
