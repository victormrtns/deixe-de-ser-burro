services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-entrelinhas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-entrelinhas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-entrelinhas} -d ${POSTGRES_DB:-entrelinhas}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment: &backend-environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-entrelinhas}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-entrelinhas}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:5173}
      FILES_ROOT: /data/files
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_files:/data/files
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

  migrate:
    build: ./backend
    profiles: ["tools"]
    environment: *backend-environment
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  bootstrap-author:
    build: ./backend
    profiles: ["tools"]
    environment:
      <<: *backend-environment
      AUTHOR_EMAIL: ${AUTHOR_EMAIL:-}
      AUTHOR_PASSWORD: ${AUTHOR_PASSWORD:-}
    command: ["uv", "run", "python", "-m", "app.cli", "bootstrap-author"]
    depends_on:
      db:
        condition: service_healthy

  cleanup:
    build: ./backend
    profiles: ["tools"]
    environment: *backend-environment
    command: ["uv", "run", "python", "-m", "app.cli", "cleanup-due-publications"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_files:/data/files

volumes:
  db_data:
  app_files:
